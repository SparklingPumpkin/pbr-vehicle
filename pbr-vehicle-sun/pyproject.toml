[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pbr-vehicle-sun"
version = "1.4.0"
description = "SSE-v9 accelerated two-round vehicle-replacement sun angle estimator."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24,<2",
  "scipy>=1.10",
  "opencv-python-headless>=4.8",
  "plyfile>=1.0",
  "Pillow>=9",
]

[project.optional-dependencies]
scene = ["torch>=2.1", "ultralytics>=8.2"]
test = ["pytest>=7.4", "build>=1.2"]

[project.scripts]
pbr-vehicle-sun-fit = "pbr_vehicle_sun.run_sse_mainline:main"
pbr-vehicle-sun-scene = "pbr_vehicle_sun.run_sse_scene_two_round:main"
pbr-vehicle-sun-scene-round = "pbr_vehicle_sun.run_sse_scene_global_top3:main"
pbr-vehicle-sun-associate-shadow = "pbr_vehicle_sun.run_ssisv2_vehicle_shadow_association:main"
pbr-vehicle-sun-aggregate = "pbr_vehicle_sun.run_sse_confidence_gated_joint:main"
pbr-vehicle-sun-shadow-lift = "pbr_vehicle_sun.lift_source_shadow_with_infinidepth:main"
pbr-vehicle-sun-vehicle-geometry = "pbr_vehicle_sun.extract_infinidepth_vehicle_geometry:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
