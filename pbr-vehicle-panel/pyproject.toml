[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pbr-vehicle-panel"
version = "1.3.0"
description = "Interactive Gaussian PBR vehicle panel with runtime two-layer projections."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.24,<2",
  "opencv-python-headless>=4.8,<5",
  "pillow>=9.0",
  "plyfile>=1.0",
  "scipy>=1.9,<1.10",
  "trimesh>=4.0",
  "viser>=1.0.15",
]

[project.optional-dependencies]
pth = ["torch>=2.1"]
test = ["pytest>=7.4"]

[project.scripts]
pbr-vehicle-panel = "pbr_vehicle_standalone.cli:main"
pbr-vehicle-viewer = "pbr_vehicle_standalone.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
